         C 12 77, 15 86, 23 93
         L 67 131
         C 72 135, 78 135, 83 131
         L 127 93
         C 135 86, 138 77, 134 68
         L 113 24
         C 110 17, 104 14, 98 14
         Z"
      fill="#FF5B00"
    />

    <!-- White Stylized Archway / Chevron Cutout -->
